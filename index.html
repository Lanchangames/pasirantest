<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Magic Sticky Notes</title>
    <style>
        /* フォント整理: 汎用的な明朝体(Shippori Mincho)と、付箋用の手書き風(Klee One)のみに絞る */
        @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@400;500&display=swap');
        
        :root { 
            --bg-dark: #121212;     /* 全体背景 */
            --bg-panel: rgba(18, 18, 18, 0.85); /* 半透明パネル */
            --paper: #f4f1ea;       /* 日誌の色：白すぎないアイボリー */
            --text-main: #e0e0e0;   /* ベースの文字色 */
            --text-paper: #2c2c2c;  /* 紙の上の文字色 */
            --border-subtle: #333333;
            
            /* 付箋の色：通常時は淡い水色。Collectionでは各属性の色 */
            --note-base: #e6f2f5;
            --note-prank: #d9edf8;
            --note-care: #e2f0d9;
            --note-self: #f8e1e1;
            --note-rival: #ede4f5;  
            --note-gold: #fcf4cb;
        }
        
        body { 
            margin: 0; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Shippori Mincho', serif; 
            overflow-y: auto; 
            user-select: none; 
            letter-spacing: 0.05em;
        }

        #sky { position: fixed; inset: 0; z-index: -1; background: var(--bg-dark); }
        
        /* 画面の基本レイアウト */
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 100; padding: 40px 20px; box-sizing: border-box; 
        }
        #intro { z-index: 1000; }
        #game { display: none; }

        /* タイトル画面要素のPCベース設定 */
        #intro img { max-width: 600px; margin-bottom: 40px; opacity: 0.9; }
        #intro p { max-width: 600px; line-height: 2; font-size: 0.95rem; margin-bottom: 50px; color: #aaa; }

        /* DAY切り替え：演出をゆっくりに修正 */
        #day-overlay { position: fixed; inset: 0; background: var(--bg-dark); z-index: 5000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
        #day-overlay.active { opacity: 1; pointer-events: auto; }
        #day-overlay-text { font-family: 'Shippori Mincho', serif; font-size: 1.5rem; color: #888; letter-spacing: 0.2em; font-weight: normal; }

        #day-label {
            width: 100%; max-width: 700px; text-align: left;
            font-size: 1.1rem; color: #888; margin-bottom: 10px; letter-spacing: 0.1em;
        }

        /* 机と紙（日誌）：過剰なUI感をなくし、「一枚の記録」に見せる */
        .desk { 
            width: 100%; max-width: 700px; 
            background: transparent; border: none; box-shadow: none; 
            position: relative; display: flex; flex-direction: column; 
        }
        .paper { 
            width: 100%; 
            height: 400px; /* PC版の高さを400pxに戻す */
            background: var(--paper); 
            color: var(--text-paper); 
            padding: 40px 50px; 
            position: relative; 
            border-radius: 2px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            border: 1px solid #dcdcdc; 
            box-sizing: border-box;
            overflow: hidden; 
        }
        
        #text-box { 
            font-size: 1.1rem; line-height: 2.2; text-align: left; 
            height: 100%; 
            white-space: pre-wrap; 
        }
        
        /* CLICKの点滅を控えめに */
        #click-prompt { 
            position: absolute; bottom: 20px; right: 40px; 
            font-size: 1rem; color: #aaa; 
            animation: gentle-fade 2s infinite; 
            visibility: hidden; 
            font-family: sans-serif;
            background: var(--paper); 
            padding-left: 10px;
        }
        @keyframes gentle-fade { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        /* 選択肢（付箋）出現時のコンテナ：空間の連続性を高める */
        .ui-panel { 
            position: fixed; inset: 0; 
            background: var(--bg-panel); 
            z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px;
        }
        
        #ui-msg { display: none !important; }

        .choices { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            justify-items: center;
            width: 100%; max-width: 600px; 
        }
        
        /* 通常ボタン：透明背景、細い線、角丸なし、アニメーション排除 */
        .btn { 
            background: transparent; border: 1px solid var(--border-subtle); color: var(--text-main); 
            padding: 12px 0; cursor: pointer; transition: background 0.2s, border-color 0.2s; 
            font-family: 'Shippori Mincho', serif; font-size: 1rem; width: 100%; max-width: 240px; 
            border-radius: 0; box-shadow: none; text-align: center; letter-spacing: 0.1em;
        }
        .btn:hover { background: rgba(255,255,255,0.05); border-color: #666; }
        
        #note-prompt-btn {
            grid-column: 1 / -1;
            justify-self: center;
        }

        /* タイトル画面の付箋ボタン */
        .title-note-btn {
            font-family: 'Klee One', cursive;
            background-color: var(--note-base);
            color: #333;
            border: none;
            border-radius: 0;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2);
            width: 82%;
            max-width: 260px;
            min-height: 68px;
            height: auto;
            padding: 12px 16px;
            font-size: 0.88rem;
            line-height: 1.5;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
        }
        .title-note-btn:nth-child(1), .title-note-btn:nth-child(3) { transform: rotate(-1deg); }
        .title-note-btn:nth-child(2) { transform: rotate(1deg); }
        .title-note-btn:hover { transform: scale(1.02) rotate(0deg); box-shadow: 2px 6px 12px rgba(0,0,0,0.3); }

        /* 選択肢の付箋：このゲームの主役 */
        .sticky-note {
            width: 100%; max-width: 180px; aspect-ratio: 1 / 1; 
            height: auto;
            padding: 15px; box-sizing: border-box;
            font-family: 'Klee One', cursive; /* フォントを Klee One に変更 */
            font-weight: 400;
            font-size: 1rem; line-height: 1.6;
            display: flex; align-items: center; justify-content: center; text-align: center;
            cursor: pointer;
            border-radius: 0; 
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2); 
            border: none;
            transition: transform 0.15s ease-out; 
            background-color: var(--note-base); 
            color: #333;
            transform: rotate(-1deg); 
            opacity: 0; 
            animation: note-appear 0.4s forwards ease-out;
        }
        .sticky-note:nth-child(even) { transform: rotate(1deg); }
        .sticky-note:hover { transform: scale(1.02) rotate(0deg); box-shadow: 2px 6px 12px rgba(0,0,0,0.3); }

        @keyframes note-appear {
            0% { opacity: 0; transform: translateY(-5px) rotate(0deg); }
            100% { opacity: 1; }
        }

        @keyframes coll-note-appear {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .sticky-note:nth-child(1) { animation-delay: 0.1s; }
        .sticky-note:nth-child(2) { animation-delay: 0.2s; }
        .sticky-note:nth-child(3) { animation-delay: 0.3s; }
        .sticky-note:nth-child(4) { animation-delay: 0.4s; }
        
        /* 黄金の付箋 */
        .sticky-note.gold-choice {
            grid-column: 1 / -1;
            width: 100%; max-width: 380px; aspect-ratio: auto; height: 100px;
            background-color: var(--note-gold) !important;
            border: 1px solid #d4af37;
            font-family: 'Shippori Mincho', serif; 
        }

        /* Collection & Extra 画面 */
        #collection, #extra { 
            background: var(--bg-dark); overflow-y: auto; padding: 60px 20px 100px 20px; 
            z-index: 6000; display: none; flex-direction: column; align-items: flex-start; 
            max-width: 800px; margin: 0 auto; width: 100%;
        }
        #collection {
            left: 50%;
            transform: translateX(-50%);
        }
        
        h2 { font-weight: normal; font-size: 1.5rem; letter-spacing: 0.1em; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; width: 100%; text-align: left; margin-top: 0;}
        .sub-text { font-size: 0.9rem; color: #888; margin-bottom: 30px; text-align: left; width: 100%;}

        .content-box { width: 100%; text-align: left; line-height: 1.8; margin-bottom: 40px; font-size: 0.95rem; color: #ccc;}
        .content-box h3 { font-weight: normal; font-size: 1.1rem; color: #eee; margin-top: 30px; border-bottom: 1px dashed var(--border-subtle); padding-bottom: 5px;}

        /* コレクションのグリッド */
        .coll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; width: 100%; margin-top: 20px; }
        .coll-note {
            height: 160px;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        .coll-note-front,
        .coll-note-back {
            position: absolute;
            inset: 0;
            padding: 15px;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            transition: transform 0.4s ease;
            -webkit-transition: -webkit-transform 0.4s ease;

            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            text-align: left;
            box-sizing: border-box;
        }

        .coll-note-front {
            transform: rotateY(0deg);
            -webkit-transform: rotateY(0deg);

            font-family: 'Klee One', cursive; /* フォントを Klee One に変更 */
            font-weight: 400;
            font-size: 1rem;
            color: #333;
        }

        .coll-note-back {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);

            background: #222 !important;
            color: #eee;
            font-family: 'Shippori Mincho', serif;
            font-size: 0.9rem;
            border: 1px solid #444;
            overflow-y: auto;
            overflow-x: hidden;
            overflow-wrap: anywhere;
        }

        .coll-note.flipped .coll-note-front {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }

        .coll-note.flipped .coll-note-back {
            transform: rotateY(0deg);
            -webkit-transform: rotateY(0deg);
        }

        /* =========================================
           スマホ向けレイアウト調整
           ========================================= */
        @media (max-width: 600px) {
            .screen { padding: 40px 20px; }
            
            #intro { padding: 0 24px; box-sizing: border-box; }
            #intro img { width: 100%; max-width: 420px; margin-bottom: 16px; }
            #intro p { font-size: 0.9rem; line-height: 1.9; margin-bottom: 30px; }
            
            #day-label { 
                font-size: 0.8rem; 
                letter-spacing: 0.2em; 
                width: 100%; text-align: left; 
                margin-bottom: 8px; 
            }
            
            .desk { width: 100%; }
            .paper { 
                margin: 0; 
                height: min(62vh, 520px); 
                min-height: 400px; 
                padding: 32px 26px 46px; 
                box-sizing: border-box; 
            }
            /* スマホ版の本文フォント設定を元に戻す */
            #text-box { 
                font-size: 0.95rem; 
                line-height: 1.8; 
            }
            #click-prompt { bottom: 18px; right: 24px; font-size: 0.75rem; }
            
            .choices { 
                display: flex; flex-direction: column; align-items: center; 
                gap: 14px; width: 100%; max-width: 340px; 
            }
            .sticky-note { 
                aspect-ratio: auto; width: 92%; max-width: 320px; 
                height: auto; min-height: 92px; padding: 18px 20px; font-size: 0.95rem; 
            }
            .sticky-note:nth-child(odd) { align-self: flex-start; transform: rotate(-1deg); }
            .sticky-note:nth-child(even) { align-self: flex-end; transform: rotate(1deg); }
            
            .sticky-note:nth-child(odd):hover { transform: scale(1.02) rotate(0deg); }
            .sticky-note:nth-child(even):hover { transform: scale(1.02) rotate(0deg); }
            
            .sticky-note.gold-choice { 
                width: 100%; max-width: 340px; height: auto; min-height: 90px; 
                align-self: center; transform: rotate(0deg); 
            }
            
            #collection, #extra { box-sizing: border-box; padding: 36px 20px 80px; }
            .coll-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .coll-note { height: 145px; }
        }
    </style>
</head>
<body>
    <script src="scenarios.js"></script>

    <div id="day-overlay"><div id="day-overlay-text"></div></div>
    <div id="sky"></div>
    
    <div id="intro" class="screen">
        <img src="title.png" alt="Magic Sticky Notes">
        <p>
            夜の書庫番を任された副団長たち。<br>
            2人の秘密の2週間が今始まる――！
        </p>
        <div style="display:flex; flex-direction: column; gap:15px; align-items: center; width: 100%;">
            <button class="title-note-btn" onclick="initAudio(); startPrologue();">物語をはじめる</button>
            <button class="title-note-btn" onclick="openCollection();">付箋コレクション</button>
            <button class="title-note-btn" onclick="openExtra();">INFORMATION</button>
        </div>
    </div>

    <div id="game" class="screen">
        <div id="day-label">DAY 1</div>
        <div class="desk" id="desk-trigger">
            <div class="paper">
                <div id="text-box"></div>
                <div id="click-prompt">continue ›</div>
            </div>
        </div>
        
        <div class="ui-panel" id="ui-panel">
            <div id="ui-msg"></div> 
            <div id="choice-area" class="choices"></div>
        </div>
    </div>

    <div id="collection" class="screen">
        <h2>COLLECTION</h2>
        <div class="sub-text">付箋をクリックして裏返すと、パーシヴァルの反応を確認できます。</div>
        
        <div style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; font-size: 0.9rem; color: #888;">
            <span id="b-care" style="opacity:0.3;">I お茶はふたり分</span>
            <span id="b-self" style="opacity:0.3;">II きみに言いたかったこと</span>
            <span id="b-rival" style="opacity:0.3;">III ちゃんと、俺を見てて</span>
            <span id="b-prank" style="opacity:0.3;">IV 笑ったほうの勝ち</span>
            <span id="b-war" style="opacity:0.3;">V 勝負はまた明日</span>
            <span id="b-true_love" style="opacity:0.3;">VI きみの隣で、続きを</span>
            <span id="b-grand" style="opacity:0.3;">VII また明日、十五日目</span>
        </div>

        <div id="coll-grid" class="coll-grid"></div>
        
        <div style="display:flex; gap:15px; margin-top:50px; width: 100%;">
            <button class="btn" onclick="closeCollection();" style="max-width: 150px;">BACK</button>
        </div>
    </div>

    <div id="extra" class="screen">
        <h2>INFORMATION</h2>
        <div class="content-box">
            <h3>Credits</h3>
            <p>制作・シナリオ：ろかス<br>イラスト：</p>
            <h3>Feedback</h3>
            <p>
                感想をお待ちしております。<br>
                <a href="https://marshmallow-qa.com/oj0afz3donoawsc"
                   target="_blank"
                   rel="noopener noreferrer">
                    マシュマロ
                </a>
            </p>
        </div>
        <button class="btn" onclick="closeExtra();" style="max-width: 150px;">BACK</button>
    </div>

<script>
    let audioCtx;
    function initAudio() { if(!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)(); }
    
    function playPageSound() {
        if(!audioCtx) return;
        const gain = audioCtx.createGain(); gain.gain.value = 0.02;
        const osc = audioCtx.createOscillator(); osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    let day = 0;
    let scores = { prank:0, care:0, self:0, rival:0, true:0, grand:0 };
    let affection = 0;
    let textBuffer = [];
    let textIdx = 0;
    let isTyping = false;
    let skipRequested = false;
    let lastSkipTime = 0;
    let isEndingMode = false;
    let isFinalDayReply = false;
    let isAdvancing = false;
    let isPrankWar = false;
    let choiceMade = false;
    let currentRunNotes = [];
    let lastActionTrace = "";

    function startPrologue() { 
        day = 0; isEndingMode = false; isFinalDayReply = false; choiceMade = false; textIdx = 0;
        document.getElementById('intro').style.display = 'none';
        document.getElementById('game').style.display = 'flex';
        render();
    }

    function render() {
        if (day > 14) return;
        choiceMade = false;
        document.getElementById('ui-panel').style.display = 'none';
        document.getElementById('text-box').innerHTML = "";
        
        const dayStr = day === 0 ? "PROLOGUE" : `DAY ${String(day).padStart(2, '0')}`;
        document.getElementById('day-label').innerText = dayStr;

        showDayOverlay(dayStr, () => {
            if (day === 8 && (scores.rival === 7)) isPrankWar = true; 
            const data = (isPrankWar && day >= 8) ? warScenarios[day] : scenarios[day];
            let trace = (day <= 7) ? "日誌が静かに置かれている" : "色とりどりの付箋が机を飾っている";
            if (day === 0) trace = "";
            if (lastActionTrace) trace = lastActionTrace;
            
            textBuffer = [...data.s.map(l => l.replace("{TRACE}", trace)), ...data.d];
            textIdx = 0;
            advance();
        });
    }

    /* DAY切り替え演出をゆっくりに変更し、フェードアウト完了後にコールバックを実行 */
    function showDayOverlay(text, cb) {
        const ov = document.getElementById('day-overlay');
        document.getElementById('day-overlay-text').innerText = text;
        
        ov.classList.add('active');
        
        setTimeout(() => {
            ov.classList.remove('active');
            
            setTimeout(() => {
                if (cb) cb();
            }, 600);
            
        }, 1200);
    }

    async function advance() {
        if (isTyping) {
            skipRequested = true;
            lastSkipTime = Date.now();
            return;
        }

        if (isAdvancing) {
            return;
        }

        if (Date.now() - lastSkipTime < 200) {
            return;
        }

        isAdvancing = true;

        try {
            if (textIdx < textBuffer.length) {
                await typeLine(textBuffer[textIdx++]);
                document.getElementById('click-prompt').style.visibility = 'visible';
            } else {
                document.getElementById('click-prompt').style.visibility = 'hidden';

                // DAY14だけは次の日が存在しないため、選択肢の反応(r)を
                // その場で表示してからエンディングへ進む。
                if (isFinalDayReply) {
                    isFinalDayReply = false;
                    day = 15;
                    document.getElementById('ui-panel').style.display = 'flex';
                    document.getElementById('choice-area').innerHTML =
                        '<button class="btn" style="border-color:#d4af37; color:#d4af37;" onclick="prepareEpilogue()">エンディングへ</button>';
                    return;
                }

                if(!isEndingMode) {
                    document.getElementById('ui-panel').style.display = 'flex';

                    if (day === 0) {
                        showOptions();
                    } else {
                        showNotePrompt();
                    }
                } else {
                    startEpilogue();
                }
            }
        } finally {
            isAdvancing = false;
        }
    }

    function showNotePrompt() {
        const area = document.getElementById('choice-area');

        let label = "今日は付箋に何を書こうか";

        if (isPrankWar) {
            if (day === 14) {
                label = "最後の勝負、どう返そうか";
            } else {
                label = "この勝負、どう返そうか";
            }
        } else if (day === 8) {
            label = "さて、何て返そうか";
        }

        area.innerHTML = `
            <button class="btn" id="note-prompt-btn">${label}</button>
        `;

        document.getElementById('note-prompt-btn').onclick = (e) => {
            e.stopPropagation();
            showOptions();
        };
    }

    async function typeLine(line) {
        isTyping = true;
        skipRequested = false;

        document.getElementById('click-prompt').style.visibility = 'hidden';

        const box = document.getElementById('text-box');
        box.innerHTML = "";

        playPageSound();

        for (let char of line) {
            if (skipRequested) {
                box.innerHTML = line;
                break;
            }

            box.innerHTML += char;
            await new Promise(r => setTimeout(r, 15));
        }

        isTyping = false;
        skipRequested = false;
    }

    document.getElementById('desk-trigger').onclick = () => {
        if((!choiceMade || isEndingMode || isFinalDayReply) && document.getElementById('ui-panel').style.display !== 'flex') advance();
    };

    function showOptions() {
        playPageSound(); 
        const area = document.getElementById('choice-area'); area.innerHTML = '';
        const data = (isPrankWar && day >= 8) ? warScenarios[day] : scenarios[day];
        let opts = [...data.o].sort(() => Math.random() - 0.5); 
        
        // DAY10〜13：黄金の付箋
        if (
            !isPrankWar &&
            day >= 10 &&
            day < 14 &&
            affection >= 90 &&
            getSeenBadgeCount() >= 2
        ) {
            const golds = {
                10: {
                    t: "『お前とこうして話す時間、好きだよ』",
                    c: 'true',
                    r: "二枚の付箋が風もないのに隣り合う。赤い付箋には『俺も好きだが？　お前が今さら何を驚いている』。紙を手に取ると、ほんの少しだけ暖かい。"
                },
                11: {
                    t: "『お前が相棒でよかったと思ってる』",
                    c: 'true',
                    r: "付箋の上に氷と炎の小さな紋様が並んで浮かぶ。赤い付箋には『俺もだ。お前だからここまで任せられる』と、迷いのない字で書かれている。"
                },
                12: {
                    t: "『このやり取りが終わるの、少し寂しい』",
                    c: 'true',
                    r: "付箋の端がなかなか机から剥がれない。赤い付箋には『……俺もだ。なら、任務が終わったからといって終わらせる必要もないだろう』と書かれている。"
                },
                13: {
                    t: "『任務が終わっても、こうして話していたい』",
                    c: 'true',
                    r: "二枚の付箋が並んだまま、しっかり机に貼り付いている。赤い付箋には『ならばそうすればいい。付箋でなくても構わん。俺もお前と話していたい』と書かれている。"
                }
            };

            opts.push(golds[day]);
        }

        // DAY14：黄金ルート最終選択肢
        if (
            !isPrankWar &&
            day === 14 &&
            scores.true >= 1
        ) {
            opts.push({
                t: "『明日からも、お前とこうして話していたい』",
                c: 'true',
                r: "付箋の裏には、後から書き足された赤い文字がある。『明日だけの話にするな、ランスロット。話したい時は来い。俺もお前に会いに行く』。"
            });
        }
        
        // 全回収エンド専用選択肢
        if (
            !isPrankWar &&
            day === 14 &&
            getSeenBadgeCount() >= 6
        ) {
            opts.push({
                t: "最後の付箋をめくる",
                c: 'grand',
                r: "裏面には、見覚えのある赤い字で追伸が残されている。『見つけたな、ランスロット。次からは隠さず渡す。お前も、消さずに書け』。"
            });
        }

        opts.forEach(o => {
            const b = document.createElement('button');
            if (day === 0) {
                b.className = 'btn';
                b.style.gridColumn = "1 / -1"; 
            } else {
                b.className = 'sticky-note' + (o.c === 'true' || o.c === 'grand' ? ' gold-choice' : '');
            }
            b.innerText = o.t;
            b.onclick = (e) => { e.stopPropagation(); selectChoice(o); };
            area.appendChild(b);
        });
    }

    function selectChoice(o) {
        if (choiceMade) return;
        choiceMade = true;

        document.getElementById('ui-panel').style.display = 'none';
        document.getElementById('text-box').innerHTML = "";

        // PROLOGUEは固定進行なので、選択結果として記録しない
        if (day !== 0) {
            scores[o.c]++;
            affection += (o.c === 'true' ? 25 : 10);
            lastActionTrace = o.r;

            currentRunNotes.push({
                d: day,
                t: o.t,
                c: o.c,
                r: o.r
            });
        }

        // DAY14は「翌日」がないので、rをTRACEへ送るだけでは一度も表示されない。
        // 選んだ付箋へのパーシヴァルの返事を、その場で一度表示してから終了する。
        if (day === 14) {
            let all = JSON.parse(localStorage.getItem('lib_vFinal_S') || "[]");

            const finalNote = {
                d: day,
                t: o.t,
                c: o.c,
                r: o.r
            };

            const index = all.findIndex(x => x.t === finalNote.t);

            if (index >= 0) {
                all[index] = finalNote;
            } else {
                all.push(finalNote);
            }

            localStorage.setItem('lib_vFinal_S', JSON.stringify(all));

            setTimeout(() => {
                isFinalDayReply = true;
                textBuffer = [o.r];
                textIdx = 0;
                document.getElementById('text-box').innerHTML = "";
                advance();
            }, 150);
            return;
        }

        setTimeout(() => {
            day++;

            if (day <= 14) {
                render();
            } else {
                document.getElementById('ui-panel').style.display = 'flex';
                document.getElementById('choice-area').innerHTML =
                    '<button class="btn" style="border-color:#d4af37; color:#d4af37;" onclick="prepareEpilogue()">エンディングへ</button>';
            }
        }, 150);
    }

    function shareToX() {
        const endingNames = {
            care: "I お茶はふたり分",
            self: "II きみに言いたかったこと",
            rival: "III ちゃんと、俺を見てて",
            prank: "IV 笑ったほうの勝ち",
            war: "V 勝負はまた明日",
            true_love: "VI きみの隣で、続きを",
            grand: "VII また明日、十五日目"
        };

        const endingName = endingNames[currentEndingID] || "";
        const text = `「The Magic Sticky Notes」をプレイしました！\nEND：${endingName}`;
        const url = location.origin + location.pathname;

        const shareUrl =
            "https://twitter.com/intent/tweet?text=" +
            encodeURIComponent(text) +
            "&url=" +
            encodeURIComponent(url);

        window.open(shareUrl, "_blank", "noopener,noreferrer");
    }

    function prepareEpilogue() {
        document.getElementById('ui-panel').style.display = 'none';
        isEndingMode = true;

        let eid = "";

        const choseEarlierGold = currentRunNotes.some(
            n => n.d >= 10 && n.d <= 13 && n.c === 'true'
        );

        const choseFinalGold = currentRunNotes.some(
            n => n.d === 14 && n.c === 'true'
        );

        if (scores.grand > 0) {
            eid = "grand";
        } else if (isPrankWar) {
            eid = "war";
        } else if (choseEarlierGold && choseFinalGold) {
            eid = "true_love";
        } else {
            const keys = ['care', 'self', 'rival', 'prank'];
            eid = keys.reduce((a, b) => scores[a] > scores[b] ? a : b);
        }

        textBuffer = endingScripts[eid] || endingScripts['self'];
        textIdx = 0;
        currentEndingID = eid;
        startEpilogue();
    }

    let currentEndingID = "";
    function startEpilogue() {
        if (textIdx < textBuffer.length) {
            typeLine(textBuffer[textIdx++]).then(() => {
                document.getElementById('click-prompt').style.visibility = 'visible';
            });
        } else {
            showFinalButtons();
        }
    }

    function showFinalButtons() {
        saveRun(currentEndingID);

        document.getElementById('ui-panel').style.display = 'flex';
        document.getElementById('choice-area').innerHTML = `
            <button class="btn" onclick="location.reload()">スタート画面に戻る</button>
            <button class="btn" onclick="shareToX()">Xで報告する</button>
        `;
    }

    function getSeenBadgeCount() {
        const b = JSON.parse(localStorage.getItem('badge_vFinal_S') || '{}');
        const keys = ['care', 'self', 'rival', 'prank', 'war', 'true_love']; 
        return keys.filter(k => b[k]).length;
    }

    function saveRun(eid) {
        let all = JSON.parse(localStorage.getItem('lib_vFinal_S') || "[]");
        currentRunNotes.forEach(n => {
            const index = all.findIndex(x => x.t === n.t);
            if (index >= 0) {
                all[index] = n;
            } else {
                all.push(n);
            }
        });
        localStorage.setItem('lib_vFinal_S', JSON.stringify(all));
        
        const b = JSON.parse(localStorage.getItem('badge_vFinal_S') || '{}');
        if (eid === "grand_finale" || eid === "grand") {
            b.grand = true;
        } else {
            b[eid] = true;
        }
        localStorage.setItem('badge_vFinal_S', JSON.stringify(b));
    }

    function openCollection() { 
        document.getElementById('intro').style.display = 'none';
        document.getElementById('game').style.display = 'none';
        document.getElementById('collection').style.display = 'flex';
        showCollection();
    }
    function closeCollection() { 
        document.getElementById('collection').style.display = 'none'; 
        if(day > 14) { location.reload(); }
        else { document.getElementById('intro').style.display = 'flex'; }
    }
    function openExtra() { document.getElementById('intro').style.display = 'none'; document.getElementById('extra').style.display = 'flex'; }
    function closeExtra() { document.getElementById('extra').style.display = 'none'; document.getElementById('intro').style.display = 'flex'; }

    function repairLegacyDay14Notes(all) {
        const candidates = [];

        if (typeof scenarios !== 'undefined' &&
            scenarios[14] &&
            Array.isArray(scenarios[14].o)) {
            candidates.push(...scenarios[14].o);
        }

        if (typeof warScenarios !== 'undefined' &&
            warScenarios[14] &&
            Array.isArray(warScenarios[14].o)) {
            candidates.push(...warScenarios[14].o);
        }

        candidates.push(
            {
                t: "『明日からも、お前とこうして話していたい』",
                c: 'true',
                r: "付箋の裏には、後から書き足された赤い文字がある。『明日だけの話にするな、ランスロット。話したい時は来い。俺もお前に会いに行く』。"
            },
            {
                t: "最後の付箋をめくる",
                c: 'grand',
                r: "裏面には、見覚えのある赤い字で追伸が残されている。『見つけたな、ランスロット。次からは隠さず渡す。お前も、消さずに書け』。"
            },
            {
                t: "『これからも、俺のことちゃんと見てて』",
                c: 'rival',
                r: "付箋の裏には『言われなくても見る。勝負があろうとなかろうと、お前が何をするかくらいな』と書かれている。"
            },
            {
                t: "『これからも、本気で俺のこと見てて』",
                c: 'rival',
                r: "付箋の裏には『ああ。勝負があろうとなかろうと、お前が何をするかくらい見ている』と書かれている。"
            }
        );

        return all.map(n => {
            if (
                n.d !== 14 ||
                (typeof n.r === 'string' && n.r.trim() !== '')
            ) {
                return n;
            }

            const found = candidates.find(o => o.t === n.t);

            if (!found) {
                return n;
            }

            return {
                ...n,
                c: n.c || found.c,
                r: found.r
            };
        });
    }

    function showCollection() {
        const grid = document.getElementById('coll-grid'); grid.innerHTML = '';
        let all = JSON.parse(localStorage.getItem('lib_vFinal_S') || "[]");

        // 旧仕様で保存されたPROLOGUEの固定進行ボタンを除去
        all = all.filter(n => n.d !== 0);

        // 旧仕様で裏面が空白のDAY14付箋を、現在のシナリオ内容から補完
        all = repairLegacyDay14Notes(all);

        // 除去後の状態を保存し直す
        localStorage.setItem('lib_vFinal_S', JSON.stringify(all));

        if (all.length === 0) grid.innerHTML = '<div style="grid-column: 1/-1; padding: 20px; color: #666;">記録がありません。</div>';
        else {
            all.sort((a,b) => a.d - b.d).forEach((n, idx) => {
                const note = document.createElement('div');
                note.className = 'coll-note';
                
                const bg = n.c==='prank'?'var(--note-prank)':n.c==='care'?'var(--note-care)':n.c==='self'?'var(--note-self)':n.c==='rival'?'var(--note-rival)':'var(--note-gold)';
                
                note.innerHTML = `
                    <div class="coll-note-front" style="background:${bg}">
                        <div style="font-size:0.8rem; color:#666;">
                            DAY ${String(n.d).padStart(2, '0')}
                        </div>
                        <div style="font-size:1.1rem; margin-top:8px;">
                            ${n.t}
                        </div>
                    </div>
                    <div class="coll-note-back">
                        <div>
                            ${n.r}
                        </div>
                    </div>
                `;
                note.style.animation = `coll-note-appear 0.4s forwards ${idx * 0.05}s`;
                note.style.opacity = 0;
                
                note.onclick = () => { playPageSound(); note.classList.toggle('flipped'); };
                grid.appendChild(note);
            });
        }
        
        const b = JSON.parse(localStorage.getItem('badge_vFinal_S') || '{}');
        const mapping = {prank:'b-prank', care:'b-care', self:'b-self', rival:'b-rival', war:'b-war', true_love:'b-true_love', grand:'b-grand'}; 
        for(let key in mapping) {
            if(b[key] || (key==='grand' && b.grand_finale)) {
                document.getElementById(mapping[key]).style.opacity = '1';
                document.getElementById(mapping[key]).style.color = '#d4af37';
            }
        }
    }
</script>
